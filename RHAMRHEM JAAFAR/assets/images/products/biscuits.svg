  </defs>
  <!-- Cookie 1 (Back) -->
  <circle cx="50" cy="42" r="18" fill="url(#cookieGrad)" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="44" cy="38" r="2.5" fill="#451a03"/>
  <circle cx="56" cy="40" r="2" fill="#451a03"/>
  <circle cx="48" cy="48" r="2" fill="#451a03"/>
  <!-- Cookie 2 (Front) -->
  <circle cx="70" cy="50" r="20" fill="url(#cookieGrad)" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="64" cy="46" r="3" fill="#451a03"/>
  <circle cx="76" cy="48" r="2.5" fill="#451a03"/>
  <circle cx="70" cy="58" r="2.5" fill="#451a03"/>
  <circle cx="62" cy="56" r="2" fill="#451a03"/>
  <!-- Snack Box / Pack Wrap at Bottom -->
  <rect x="28" y="66" width="64" height="34" rx="4" fill="url(#wrapperBisc)" stroke="#075985" stroke-width="1.2"/>
  <rect x="34" y="74" width="52" height="18" rx="2" fill="#fef08a"/>
  <text x="60" y="86" font-family="sans-serif" font-weight="900" font-size="7" fill="#854d0e" text-anchor="middle" letter-spacing="0.5">COOKIES</text>
