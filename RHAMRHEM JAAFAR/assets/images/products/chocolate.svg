<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="chocoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1302"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <!-- Exposed Chocolate Chunks at Top -->
  <rect x="40" y="24" width="40" height="26" rx="3" fill="url(#chocoGrad)" stroke="#270e02" stroke-width="1"/>
  <!-- Chocolate Grid Lines -->
  <line x1="60" y1="24" x2="60" y2="48" stroke="#270e02" stroke-width="1.5"/>
  <line x1="40" y1="36" x2="80" y2="36" stroke="#270e02" stroke-width="1.5"/>
  <!-- Foil Rip -->
  <polygon points="36,44 44,48 52,43 60,47 68,44 76,49 84,45 84,54 36,54" fill="url(#foilGrad)"/>
  <!-- Purple Main Wrapper -->
  <rect x="36" y="50" width="48" height="52" rx="3" fill="url(#wrapperGrad)" stroke="#3b0764" stroke-width="1.2"/>
  <rect x="40" y="66" width="40" height="18" rx="2" fill="#fef08a"/>
  <text x="60" y="79" font-family="sans-serif" font-weight="900" font-size="7" fill="#713f12" text-anchor="middle" letter-spacing="0.5">CHOCO</text>
  <path d="M36,96 L84,96" stroke="#fbbf24" stroke-width="2"/>
</svg>
